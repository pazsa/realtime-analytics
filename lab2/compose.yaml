name: lab02

x-logging: &logging
  driver: json-file
  options: {max-size: "5m", max-file: "2"}

services:
  kafka:
    image: apache/kafka:4.2.1
    logging: *logging
    environment:
      CLUSTER_ID: bGFiMDItcmVmZXJlbmNlMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: -1
    ports: ['127.0.0.1:19092:19092']
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server kafka:9092
          --list >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30

  topic-init:
    image: apache/kafka:4.2.1
    logging: *logging
    depends_on:
      kafka: {condition: service_healthy}
    command: >-
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic lab02.orders
      --partitions 3
      --replication-factor 1
      --config cleanup.policy=delete
      --config retention.ms=-1
      --config retention.bytes=-1

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    logging: *logging
    environment:
      CLICKHOUSE_USER: lab02_admin
      CLICKHOUSE_PASSWORD: lab02_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports: ['127.0.0.1:18132:8123']
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user lab02_admin
          --password lab02_local
          --query 'SELECT 1'
      interval: 3s
      timeout: 5s
      retries: 40

  checker:
    image: ghcr.io/cra/checker-npl-rt1-lab02:2026
    profiles: [check]
    env_file: [lab02-checker.env]
    stdin_open: true
    tty: true
    depends_on:
      clickhouse: {condition: service_healthy}
      topic-init: {condition: service_completed_successfully}
  kcat:
    image: edenhill/kcat:1.7.1
    profiles: [tools]
volumes:
  kafka-data:
  clickhouse-data:
