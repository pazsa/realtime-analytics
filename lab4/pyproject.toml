[project]
name = "lab03-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "prometheus-client",
    "clickhouse-connect[async]>=1.10,<2",
    "uvicorn>=0.30,<1",
]

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
